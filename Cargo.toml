[workspace]
members = ["crates/protocol", "crates/server", "crates/device-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/ekravo/ekravo-airport"
rust-version = "1.89"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
thiserror = "2"
tracing = "0.1"

# sqlx-sqlite 0.8.6 pins libsqlite3-sys 0.30.1, whose bundled SQLite 3.46
# contains CVE-2026-119375 (RUSTSEC-2026-0459). The fixed sqlx release (0.9.1)
# requires Rust 1.94, which is above this project's declared 1.89 MSRV. The
# vendored copy changes only that binding version to the patched 0.39.1.
# See vendor/sqlx-sqlite/PATCH.md; remove it when sqlx supports the fix at 1.89.
[patch.crates-io]
sqlx-sqlite = { path = "vendor/sqlx-sqlite" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
