name: Bug report
description: Report a reproducible defect in Airport, the SDK, or the reference device.
title: "[bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include access tokens, refresh tokens, device credentials, pairing
        codes, TLS private keys, passwords, or message payloads. Report security
        vulnerabilities through the private security policy instead.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The release tag or commit you tested.
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Server
        - TypeScript SDK
        - Rust protocol crate
        - Reference device client
        - Deployment (Docker/systemd)
        - Documentation
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened?
      description: Include the exact command and the smallest sanitized reproduction you can.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS and architecture, Rust and Node versions, transport (plaintext/TLS), and database setup.
    validations:
      required: true
  - type: checkboxes
    id: hygiene
    attributes:
      label: Before submitting
      options:
        - label: I removed credentials, tokens, keys, and message contents from this report.
          required: true
        - label: I checked the existing issues for a duplicate.
          required: true
